name: CI

on:
  push:
    branches: [main, stg]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: false
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: mohamedmagdy122/reusable-backend-ci/.github/workflows/reusable-backend-ci.yml@main
    with:
      dotnet-version: '10.0.x'
      project-path: Catalog.API/Catalog.API.csproj
      test-path: Catalog.API.Tests/Catalog.API.Tests.csproj
      run-tests: true
      image-name: catalog-api
    secrets: inherit
